# Overlay the current protected Helm values; never install this file alone.
# Requires cert-manager. Preserve the existing OIDC overlay and image digests.
gatewayConfig:
  openshell.gateway.auth:
    allow_unauthenticated_users: false
  openshell.gateway.mtls_auth:
    # OIDC suppresses the automatic mTLS-user default: enable both explicitly.
    enabled: true
    # GitHub repository access needs no runtime-credential extraction authority.
    operator_enabled: false
server:
  disableTls: false
  auth:
    allowUnauthenticatedUsers: false
  tls:
    enableMtls: true
    certSecretName: openshell-server-tls
    clientCaSecretName: openshell-server-client-ca
    clientTlsSecretName: openshell-client-tls
pkiInitJob:
  enabled: true
certManager:
  enabled: true
  caSecretName: openshell-ca-tls
  clientCaFromServerTlsSecret: true
  certificateDuration: 2160h
  certificateRenewBefore: 360h
  serverDnsNames:
    - openshell-gateway.openshell-system.svc
    - openshell-gateway.openshell-system.svc.cluster.local
  serverIpAddresses:
    - 127.0.0.1
